name: Weekly lead scan

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC = 6:00 AM Eastern (7:00 AM during daylight time)
  workflow_dispatch:
    inputs:
      only:
        description: "Run one source id only (optional, skips email)"
        required: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m leadintel.main --only "${{ github.event.inputs.only }}"
          else
            python -m leadintel.main
          fi

      - name: Save results
        run: |
          git config user.name "lead-scanner"
          git config user.email "lead-scanner@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Lead scan $(date +%F)"
          git push
